function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
async function derive(pw){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},k,256));}
async function dec(raw,buf){var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12)));}
async function open_(raw){
 var html=new TextDecoder().decode(await dec(raw,b64(P.data)));
 try{sessionStorage.setItem('stt2b_k',u2b(raw));sessionStorage.setItem('stt2b_salt',P.salt);}catch(e){}
 window.STT2B_KEYRAW=raw; window.STT2B_ASSETS=P.assets;
 document.open();document.write(html);document.close();}
async function tryStored(){try{var s=localStorage.getItem('stt2b_k')||sessionStorage.getItem('stt2b_k');var t=+(localStorage.getItem('stt2b_t')||0);

 await open_(b64(s));}catch(e){}}
