 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},k,256));}
async function dec(raw,buf){var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12)));}
async function open_(raw){
 var html=new TextDecoder().decode(await dec(raw,b64(P.data)));
 try{sessionStorage.setItem('kit_k',u2b(raw));sessionStorage.setItem(K+'_salt',P.salt);}catch(e){}
 window.KIT_KEYRAW=raw; window.KIT_ASSETS=P.assets;
 document.open();document.write(html);document.close();}
async function tryStored(){try{var s=localStorage.getItem(K)||sessionStorage.getItem(K);var t=+(localStorage.getItem(K+'_t')||0);
 if(!s||(localStorage.getItem(K)&&Date.now()>t)||(localStorage.getItem(K+'_salt')||sessionStorage.getItem(K+'_salt'))!==P.salt)return;
 await open_(b64(s));}catch(e){}}
document.getElementById('f').onsubmit=async function(e){e.preventDefault();var b=document.getElementById('go'),er=document.getElementById('err');
 b.disabled=true;er.textContent='';
 try{var raw=await derive(document.getElementById('pw').value);
  if(document.getElementById('rm').checked){try{localStorage.setItem(K,u2b(raw));localStorage.setItem(K+'_salt',P.salt);localStorage.setItem(K+'_t',Date.now()+7*864e5);}catch(x){}}
  try{sessionStorage.setItem(K,u2b(raw));}catch(x){}
  await open_(raw);}
 catch(x){b.disabled=false;er.textContent='Sai mật khẩu / Wrong password';}};
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='Trình duyệt không hỗ trợ giải mã (cần HTTPS).';}else tryStored();
</script></body></html>
