<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>STT2B Mechanical Dashboard</title>
<link rel="icon" href="dashboard_data/favicon.png">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#14263a; --ink2:#4a5b6e; --ink3:#7b8a9a; --line:#dde3ea; --line2:#eef1f5;
  --navy:#0f2a44; --navy2:#173b5e; --accent:#0b7a8f;
  --st-installed:#2e9d5b; --st-arrived:#2f6fde; --st-late:#d62f2f; --st-pending:#a3adb8;
  --dw-IFC:#1f8a70; --dw-AFC:#3a7bd5; --dw-IFR:#e09b06; --dw-NYI:#a3adb8; --dw-NA:#d9dee4; --dw-OTHER:#7e57c2;
  --sp-none:#cdd4dc; --sp-fab:#9cc0ee; --sp-paint:#5b93dd; --sp-inst:#2263bd; --sp-final:#0f3a73; --sp-na:#eceff2;
  --hl:#E6007E; --hl-row:#ffe1f0; --late-bg:#fdeaea; --ok:#2e9d5b;
  --shadow:0 1px 2px rgba(16,38,58,.06),0 2px 8px rgba(16,38,58,.05);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 380px}
.mark{width:38px;height:38px;border-radius:9px;background:#fff1;display:flex;align-items:flex-end;gap:3px;padding:7px;flex:none}
.mark i{display:block;width:5px;background:#3fc4dc;border-radius:2px}
.mark i:nth-child(3){background:var(--hl)}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:12px;color:#c4d3e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub b{color:#fff;font-weight:600}
.hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.pill:hover{background:#ffffff26}
.pill .n{background:#fff;color:var(--navy);border-radius:999px;padding:0 7px;font-weight:700;min-width:20px;text-align:center}
.pill.warn .n{background:#ffcc4d}
.pill.chg .n{background:var(--hl);color:#fff}
.lang{display:inline-flex;border:1px solid #ffffff44;border-radius:7px;overflow:hidden}
.lang button{background:transparent;border:0;color:#cfe0f0;padding:4px 9px;font-size:12px}
.lang button.on{background:#fff;color:var(--navy);font-weight:700}
.upd{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.btn-upd{position:relative;background:#fff;color:var(--navy);border:0;border-radius:8px;padding:7px 14px;font-weight:650;display:inline-flex;align-items:center;gap:8px}
.btn-upd:hover{background:#e8f3ff}
.btn-upd[disabled]{opacity:.85;cursor:progress}
.btn-upd .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#ff3b3b;border:2px solid var(--navy);display:none}
.btn-upd.has-new .dot{display:block}
.spin{width:14px;height:14px;border:2px solid #9bb3cc;border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;display:none}
.btn-upd.busy .spin{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.upd-line{font-size:11.5px;color:#c4d3e3;white-space:nowrap}
.upd-line .new{color:#ffb3b3;font-weight:650;margin-left:6px}
.viewonly{font-size:12px;background:#ffcc4d;color:#3d2c00;border-radius:7px;padding:6px 10px;max-width:360px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;padding:10px 20px 0;background:var(--bg);position:sticky;top:58px;z-index:40;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:9px 9px 0 0;color:var(--ink2);font-weight:600;border-bottom:3px solid transparent}
nav.tabs button.on{background:var(--panel);color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .c{font-weight:500;color:var(--ink3);margin-left:4px}
main{padding:0 20px 30px}
section.tab{display:none;background:var(--panel);border-radius:0 var(--r) var(--r) var(--r);padding:16px;box-shadow:var(--shadow)}
section.tab.on{display:block}

.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#f7f9fb;border-radius:999px;padding:5px 14px;color:var(--ink2);font-weight:600}
.subtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- KPI ---------- */
.kpi-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:14px}
.kg{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fbfcfd}
.kg h3{margin:0 0 8px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between}
.kg .row{display:flex;gap:6px;flex-wrap:wrap}
.k{flex:1 1 60px;min-width:60px;border-radius:8px;padding:6px 8px;cursor:pointer;border:1px solid transparent}
.k:hover{background:#eef3f8;border-color:var(--line)}
.k.on{background:#e6f1f8;border-color:var(--accent)}
.k .v{font-size:26px;font-weight:700;line-height:1.1}
.k .l{font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center}
.k .l i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.k.red .v{color:var(--st-late)}
.k .sm{font-size:11px;color:var(--ink3)}
.stackbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:9px;background:var(--line2)}
.stackbar span{display:block;height:100%}
.chk{font-size:11.5px;margin-top:7px;color:var(--ok)}
.chk.bad{color:var(--st-late);font-weight:650}

.skid{border:1px solid #f3c2c2;background:#fff8f8;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.skid h3{margin:0 0 8px;font-size:13px;color:#9b1c1c;display:flex;gap:8px;align-items:center}
.skid h3 .n{background:var(--st-late);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.skid .rule{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:auto}

/* ---------- charts ---------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 10px;min-height:30px}
.filters .lbl{font-size:12px;color:var(--ink3)}
.chip{background:#e6f1f8;border:1px solid #b9d7e8;color:var(--navy);border-radius:999px;padding:2px 6px 2px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:#fff;border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;color:var(--ink2)}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 12px;color:var(--ink);font-weight:600}
.btn:hover{background:#f2f5f8}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.charts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:1200px){.charts{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.charts{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff;min-width:0}
.card h4{margin:0 0 10px;font-size:13px;font-weight:650;display:flex;justify-content:space-between;gap:8px}
.card h4 small{font-weight:400;color:var(--ink3);font-size:11.5px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hbar{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.hbar .lab{color:var(--ink2);text-align:right;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .lab:hover{color:var(--ink);text-decoration:underline}
.hbar .lab.on{color:var(--accent);font-weight:700}
.hbar .track{display:flex;height:20px;background:var(--line2);border-radius:4px;overflow:hidden}
.hbar .seg{height:100%;cursor:pointer;transition:opacity .15s;border-right:1px solid #fff}
.hbar .seg:last-child{border-right:0}
.hbar .seg:hover{filter:brightness(1.08)}
.hbar .seg.dim{opacity:.22}
.hbar .tot{color:var(--ink2);font-weight:600}
.wide .hbar{grid-template-columns:120px 1fr 34px}

/* ---------- tables ---------- */
.tbl-tools{display:flex;gap:10px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.search{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:240px;background:#fff}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:560px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:12.8px}
thead th{position:sticky;top:0;background:#f4f6f9;color:var(--ink2);text-align:left;font-weight:650;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:1}
thead th.ns{cursor:default}
thead th .ar{color:var(--accent)}
tbody td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f5f9fc}
tbody tr.late td{background:var(--late-bg)}
tbody tr.late td.tag{color:var(--st-late);font-weight:700}
tbody tr.sel td{background:var(--hl-row) !important;box-shadow:inset 0 1px 0 #f7a8cf,inset 0 -1px 0 #f7a8cf}
td.tag{font-weight:600;white-space:nowrap}
td.desc{min-width:200px;max-width:360px}
td.nw{white-space:nowrap}
.badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:650;white-space:nowrap;color:#fff}
.b-muted{background:#eef1f4;color:var(--ink2)}
.float-neg{color:var(--st-late);font-weight:700}
.float-pos{color:var(--ink2)}
.goto{border:0;background:transparent;font-size:15px;padding:0 4px;opacity:.75}
.goto:hover{opacity:1}
.goto[disabled]{opacity:.2;cursor:default}
.empty{padding:22px;text-align:center;color:var(--ink3)}
.count{font-size:12px;color:var(--ink3)}

/* ---------- layout tab ---------- */
.lay{display:grid;grid-template-columns:150px 1fr 410px;gap:14px;align-items:start}
@media(max-width:1350px){.lay{grid-template-columns:130px 1fr}.lay .side{grid-column:1/-1}}
@media(max-width:760px){.lay{grid-template-columns:1fr}}
.thumbs{display:flex;flex-direction:column;gap:8px}
@media(max-width:760px){.thumbs{flex-direction:row;overflow:auto}}
.thumb{border:2px solid var(--line);border-radius:8px;background:#fff;padding:4px;text-align:left;width:100%}
.thumb img{width:100%;display:block;border-radius:4px;aspect-ratio:16/9;object-fit:cover;background:#f2f4f6}
.thumb span{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px;font-weight:600}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px #0b7a8f33}
.stage-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;position:relative}
.stage-bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.stage-bar .ttl{font-weight:650;flex:1;min-width:200px}
.stage{position:relative;width:100%;background:#f3f5f7;border-radius:6px;overflow:hidden}
.stage img{display:block;width:100%;height:auto;user-select:none}
.stage .ovl{position:absolute;inset:0}
.hot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;border:2px solid transparent}
.hot:hover{border-color:#e6007e88;background:#e6007e18}
.hot.late{box-shadow:0 0 0 2px #d62f2f99}
.hot.sel{background:var(--hl);border:3px solid #fff;z-index:3;box-shadow:0 0 0 3px var(--hl),0 0 18px 6px #e6007eaa;animation:pulse 1.1s ease-in-out infinite}
.hot.sel::after{content:attr(data-n);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(8px,0.8vw,13px)}
.hot.sel::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--hl);animation:ring 1.1s ease-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--hl),0 0 10px 3px #e6007e88}50%{box-shadow:0 0 0 3px var(--hl),0 0 26px 12px #e6007ecc}}
@keyframes ring{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.35);opacity:0}}
.stage-wrap:fullscreen{background:#111;padding:14px;display:flex;flex-direction:column}
.stage-wrap:fullscreen .stage{flex:1;display:flex;align-items:center;justify-content:center;background:#111}
.stage-wrap:fullscreen .stage .inner{position:relative;max-height:calc(100vh - 80px);aspect-ratio:16/9;height:100%}
.stage-wrap:fullscreen .stage img{height:100%;width:auto}
.stage-wrap:fullscreen .stage-bar .ttl{color:#fff}
.stage .inner{position:relative}
.nobub{position:absolute;left:10px;bottom:10px;background:#fff;border:2px solid var(--hl);border-radius:8px;padding:6px 10px;font-size:12.5px;z-index:4}
.side .card{padding:10px}
.slide-hint{font-size:12px;color:var(--ink3);margin:6px 2px 0}

/* ---------- popup ---------- */
.pop{position:fixed;right:24px;top:130px;width:360px;max-width:calc(100vw - 32px);background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(10,30,50,.28);border-top:5px solid var(--hl);z-index:60;display:none}
.pop.on{display:block}
.pop.docked{position:static;width:auto;max-width:none;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line);border-top:5px solid var(--hl)}
.pop.docked dl{grid-template-columns:110px 1fr}
.pop .ph{padding:12px 14px 6px;display:flex;justify-content:space-between;gap:10px}
.pop .ph h3{margin:0;font-size:18px}
.pop .ph .d{font-size:12.5px;color:var(--ink2)}
.pop .x{border:0;background:#f1f3f6;border-radius:50%;width:28px;height:28px;font-size:16px;flex:none}
.pop dl{display:grid;grid-template-columns:118px 1fr;gap:4px 10px;margin:0;padding:6px 14px 10px;font-size:12.8px}
.pop dt{color:var(--ink3)}
.pop dd{margin:0;font-weight:550}
.pop .pf{padding:8px 14px 12px;display:flex;gap:8px;border-top:1px solid var(--line2)}
.pop .note{font-size:12px;color:var(--ink2);background:#f6f8fa;border-radius:6px;padding:6px 8px;margin:0 14px 10px}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
@media(max-width:1100px){.cal-wrap{grid-template-columns:1fr}}
.cal-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.cal-head h3{margin:0 6px;font-size:18px;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11.5px;color:var(--ink3);text-align:center;font-weight:700;padding:3px 0}
.day{min-height:92px;border:1px solid var(--line2);border-radius:7px;padding:4px 5px;background:#fbfcfd;font-size:11.5px;overflow:hidden}
.day.out{opacity:.35}
.day .dn{font-weight:700;color:var(--ink3);font-size:12px;display:flex;justify-content:space-between}
.day.has{background:#e9f4fb;border-color:#a9d0e6;cursor:pointer}
.day.has:hover{border-color:var(--accent)}
.day.has .dn{color:var(--navy)}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day.sel{background:var(--hl-row);border-color:var(--hl)}
.day .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);line-height:1.35}
.day .t.late{color:var(--st-late);font-weight:700}
.day .t.chg{text-decoration:underline dotted var(--hl)}
.day .more{color:var(--ink3)}
.cnt{background:var(--navy);color:#fff;border-radius:999px;padding:0 6px;font-size:10.5px}
.chg-up{color:var(--st-late);font-weight:700}
.chg-dn{color:var(--ok);font-weight:700}
tr.r-up td{background:#fff1f1}
tr.r-dn td{background:#eefaf2}
.info{background:#f4f8fb;border:1px solid #d6e6f1;border-radius:8px;padding:10px 12px;font-size:12.8px;color:var(--ink2);margin-bottom:12px}

/* ---------- drawer / toast ---------- */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:#fff;box-shadow:-10px 0 40px rgba(10,30,50,.25);z-index:80;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .dh h3{margin:0;font-size:16px}
.drawer .db{padding:12px 16px;overflow:auto;flex:1}
.drawer h5{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3)}
.wi{font-size:12.8px;padding:6px 8px;border-radius:6px;margin-bottom:4px;border-left:3px solid}
.wi.warn{background:#fff7e6;border-color:#e09b06}
.wi.info{background:#f2f6fa;border-color:#9fb4c8}
.wi.ok{background:#eefaf2;border-color:var(--ok)}
.wi.bad{background:#fdeeee;border-color:var(--st-late)}
.toast{opacity:0;pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:90;transition:transform .25s;max-width:min(680px,92vw);cursor:pointer;font-size:13.5px}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast.err{background:#9b1c1c}
.toast small{display:block;opacity:.8;font-size:12px;margin-top:2px}
.backdrop{position:fixed;inset:0;background:#0b1b2a55;z-index:70;display:none}
.backdrop.on{display:block}
footer{padding:0 20px 20px;color:var(--ink3);font-size:11.5px}
.fatal{margin:40px auto;max-width:640px;background:#fff;border-radius:12px;padding:24px;box-shadow:var(--shadow)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"><i style="height:12px"></i><i style="height:20px"></i><i style="height:16px"></i><i style="height:24px"></i></div>
    <div style="min-width:0">
      <h1 data-t="appTitle">STT2B – Thiết bị Mechanical</h1>
      <div class="sub" id="hdrSub"></div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="pill chg" id="pillChg" title=""><span data-t="etaChanges">Thay đổi ETA</span><span class="n" id="nChg">0</span></button>
    <button class="pill warn" id="pillWarn"><span data-t="warnings">Cảnh báo</span><span class="n" id="nWarn">0</span></button>
    <div class="lang"><button data-lang="vi" class="on">VI</button><button data-lang="en">EN</button></div>
    <div class="upd" id="updBox">
      <button class="btn-upd" id="btnUpd"><span class="spin"></span><span id="btnUpdTxt">🔄 Cập nhật dữ liệu</span><span class="dot"></span></button>
      <div class="upd-line" id="updLine"></div>
    </div>
    <div class="viewonly" id="viewOnly" style="display:none" data-t="viewOnly">Chế độ chỉ xem – mở bằng icon STT2B Dashboard để cập nhật</div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="ov" class="on"><span data-t="tabOv">Tổng quan</span></button>
  <button data-tab="lay"><span data-t="tabLay">Layout</span></button>
  <button data-tab="cal"><span data-t="tabCal">Lịch hàng về</span></button>
  <button data-tab="lift"><span data-t="tabLift">Lifting gear</span></button>
</nav>

<main>
  <!-- TAB 1 -->
  <section class="tab on" id="tab-ov">
    <div class="subtabs" id="subtabs"></div>
    <div id="ov-main"></div>
    <div id="ov-sub"></div>
  </section>

  <!-- TAB 2 -->
  <section class="tab" id="tab-lay">
    <div class="lay">
      <div class="thumbs" id="thumbs"></div>
      <div>
        <div class="stage-wrap" id="stageWrap">
          <div class="stage-bar">
            <div class="ttl" id="slideTitle"></div>
            <input class="search" id="laySearch" list="tagList" style="min-width:220px">
            <datalist id="tagList"></datalist>
            <button class="btn" id="btnFs">⛶ <span data-t="fullscreen">Toàn màn hình</span></button>
          </div>

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(s){ if(!s) return null; var p=String(s).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function fd(s){ var d = s instanceof Date ? s : pd(s); if(!d||isNaN(d)) return '—'; return ('0'+d.getDate()).slice(-2)+'-'+MON[d.getMonth()]+'-'+String(d.getFullYear()).slice(-2); }
function fdt(s){ if(!s) return '—'; var d=new Date(s); if(isNaN(d)) return s; return fd(d)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(id){ return document.getElementById(id); }

/* ---------------- tải dữ liệu ---------------- */
function loadData(cb){
  var old = document.getElementById('dataScript');
  var sc = document.createElement('script');
  sc.id='dataScript';
  sc.src = 'dashboard_data/data.js' + (IS_SERVER ? ('?t='+Date.now()) : '');
  sc.onload = function(){ if(old && old.parentNode) old.parentNode.removeChild(old); D = window.STT2B_DATA || null; cb && cb(true); };
  sc.onerror = function(){ if(sc.parentNode) sc.parentNode.removeChild(sc); cb && cb(false); };
  document.head.appendChild(sc);
}

  $('foot').innerHTML = 'MEL: '+esc(m.melPath)+' ('+fdt(m.melModified)+') · Layout: '+esc(m.pptPath)+' ('+fdt(m.pptModified)+') · Sheet "'+esc(m.sheet)+'" · '+t('updatedAt')+' '+fdt(m.generated)+' · '+(S.lang==='en'?'Read-only dashboard – source files are never modified.':'Dashboard chỉ xem – không ghi vào file gốc.');

  supFab:function(it){return !!it.sup.fab;}, supPaint:function(it){return !!it.sup.paint;}, supInst:function(it){return !!it.sup.inst;}, supFinal:function(it){return !!it.sup.final;}

}

function kTile(key, val, label, color, opts){

  return '<div class="k'+(opts.red?' red':'')+(S.f.kpi===key?' on':'')+'"'+click+' title="'+esc(title)+'"><div class="v num">'+val+'</div><div class="l">'+(color?'<i style="background:'+color+'"></i>':'')+esc(label)+'</div>'+(opts.sm?'<div class="sm">'+opts.sm+'</div>':'')+'</div>';

     kTile('arrived', K.arrived.value, t('arrived'), STC.arrived)+
     kTile('installed', K.installed.value, t('installed'), STC.installed)+
     kTile('late', K.late.value, t('lateFull'), STC.late, {red:K.late.value>0})+'</div>'+

function sortItems(rows){

    if(k==='dwgCat'){ x=DWG_ORDER.indexOf(x); y=DWG_ORDER.indexOf(y); }
    if(k==='deck'){ x=D.deckOrder.indexOf(x); y=D.deckOrder.indexOf(y); }
    if(x==null&&y==null) return a.no-b.no; if(x==null) return 1; if(y==null) return -1;

function scrollSel(){

  var rows = s.count ? items.sort(function(a,b){return (+a.bubbleNo)-(+b.bubbleNo);}) : [];
  $('sideTitle').textContent = s.count ? t('tagsOnSlide',{n:s.no}) : t('slideOverview');
  $('sideCount').textContent = s.count ? t('rows',{n:rows.length}) : '';
  if(!s.count){
    // slide tổng quát: tóm tắt theo slide
    $('layTblWrap').innerHTML='<table><thead><tr><th class="ns">Slide</th><th class="ns">'+t('c_deck')+'</th><th class="ns">'+t('total')+'</th><th class="ns">'+t('late')+'</th></tr></thead><tbody>'+
      D.slides.filter(function(x){return x.count;}).map(function(x){ var its=mainItems().filter(function(i){return i.slide===x.no;}); return '<tr data-s="'+x.no+'"><td>'+x.no+'</td><td>'+esc(x.decks.join(', '))+'</td><td class="num">'+its.length+'</td><td class="num '+(its.some(function(i){return i.late;})?'float-neg':'')+'">'+its.filter(function(i){return i.late;}).length+'</td></tr>'; }).join('')+'</tbody></table>';
    $('layTblWrap').querySelectorAll('tr[data-s]').forEach(function(tr){ tr.onclick=function(){ S.slide=+tr.dataset.s; renderLayout(); }; });
  } else {
    var h='<table><thead><tr><th class="ns">#</th><th class="ns">'+t('c_tag')+'</th><th class="ns">'+t('c_desc')+'</th><th class="ns">'+t('c_eta')+'</th><th class="ns">'+t('c_float')+'</th></tr></thead><tbody>'+
      rows.map(function(it){ return '<tr data-id="'+esc(it.id)+'" class="'+(it.late?'late ':'')+(S.sel===it.id?'sel':'')+'"><td class="num">'+esc(it.bubbleNo)+(it.bubble?'':'<sup title="'+esc(t('noBubble'))+'">*</sup>')+'</td><td class="tag">'+esc(it.label)+'</td><td style="font-size:12px;color:var(--ink2)">'+esc(it.desc)+'</td><td class="nw num">'+fd(it.eta)+'</td><td>'+floatHtml(it.float)+'</td></tr>'; }).join('')+'</tbody></table>';
    $('layTblWrap').innerHTML=h;
    $('layTblWrap').querySelectorAll('tr[data-id]').forEach(function(tr){ tr.onclick=function(){ selectTag(tr.dataset.id,{jump:true}); }; });
  }
  // danh sách gợi ý tìm kiếm
  $('tagList').innerHTML=mainItems().map(function(it){ return '<option value="'+esc(it.label+' – '+it.desc)+'">'; }).join('');
  refreshSelection();
  setTimeout(scrollSel, 50);
}
function layFind(q){
  q=(q||'').trim(); if(!q) return;
  var lab=q.split(' – ')[0].trim().toLowerCase(), descPart=(q.split(' – ')[1]||'').trim().toLowerCase();
  var c=mainItems().filter(function(it){ return it.label.toLowerCase()===lab; });
  if(c.length>1 && descPart) c=c.filter(function(it){return it.desc.toLowerCase()===descPart;}).concat(c);
  if(!c.length) c=mainItems().filter(function(it){ return matchQ(it, q); });
  if(!c.length) c=D.items.filter(function(it){ return matchQ(it, q); });
  if(!c.length){ toast(t('notFound',{q:q}), '', true); return; }
  selectTag(c[0].id,{jump:true});
}

/* =================== TAB 3 – LỊCH =================== */
function calItems(){ return D.items.filter(function(it){ return it.eta && S.calGroups[it.group]; }); }
function renderCal(){
  var items=calItems();
  if(!S.calMonth){
    var now=new Date(), first=items.map(function(i){return i.eta;}).filter(function(e){return pd(e)>=new Date(now.getFullYear(),now.getMonth(),1);}).sort()[0];
    var d=first?pd(first):now; S.calMonth=new Date(d.getFullYear(), d.getMonth(), 1);
  }
  var m=S.calMonth, y=m.getFullYear(), mo=m.getMonth();
  $('calTitle').textContent=MON[mo]+' '+y;
  // tháng có hàng về
  var months={}; D.items.forEach(function(it){ if(it.eta){ var k=it.eta.slice(0,7); months[k]=(months[k]||0)+1; } });
  var keys=Object.keys(months).sort(), cur=y+'-'+('0'+(mo+1)).slice(-2);
  if(keys.indexOf(cur)<0){ keys.push(cur); keys.sort(); }
  $('calSel').innerHTML=keys.map(function(k){ var p=k.split('-'); return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+MON[+p[1]-1]+' '+p[0]+(months[k]?' ('+months[k]+')':'')+'</option>'; }).join('');
  $('calGroups').innerHTML=[['main','grpMain'],['LQM2','grpLQ'],['MH','grpMH']].map(function(g){ return '<button data-g="'+g[0]+'" class="'+(S.calGroups[g[0]]?'on':'')+'">'+t(g[1])+'</button>'; }).join('');
  $('calGroups').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ S.calGroups[b.dataset.g]=S.calGroups[b.dataset.g]?0:1; renderCal(); }; });
  var changed={}; D.changes.forEach(function(c){ if(c.kind==='changed') changed[c.id]=c; });
  var byDay={}; items.forEach(function(it){ (byDay[it.eta]=byDay[it.eta]||[]).push(it); });
  var dows=S.lang==='en'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['T2','T3','T4','T5','T6','T7','CN'];
  var h=dows.map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
  var start=new Date(y,mo,1); var off=(start.getDay()+6)%7; start.setDate(1-off);
  var today=iso(new Date());
  var nCells=Math.ceil((off+new Date(y,mo+1,0).getDate())/7)*7;
  for(var i=0;i<nCells;i++){
    var d=new Date(start); d.setDate(start.getDate()+i); var k=iso(d), list=byDay[k]||[], out=d.getMonth()!==mo;
    h+='<div class="day'+(out?' out':'')+(list.length?' has':'')+(k===today?' today':'')+(S.calDay===k?' sel':'')+'" data-d="'+k+'"><div class="dn"><span>'+d.getDate()+'</span>'+(list.length?'<span class="cnt">'+list.length+'</span>':'')+'</div>'+
      list.slice(0,4).map(function(it){ return '<span class="t'+(it.late?' late':'')+(changed[it.id]?' chg':'')+'" title="'+esc(it.label+' – '+it.desc)+'">'+esc(it.label)+'</span>'; }).join('')+
      (list.length>4?'<span class="more">+'+(list.length-4)+'</span>':'')+'</div>';
  }
  $('cal').innerHTML=h;
  $('cal').querySelectorAll('.day.has').forEach(function(el){ el.onclick=function(){ S.calDay = S.calDay===el.dataset.d ? null : el.dataset.d; renderCal(); }; });
  // danh sách
  var rows = S.calDay ? (byDay[S.calDay]||[]) : items.filter(function(it){ return it.eta.slice(0,7)===cur; });
  rows=rows.slice().sort(function(a,b){ return a.eta<b.eta?-1:a.eta>b.eta?1:a.no-b.no; });
  $('calListTitle').textContent = S.calDay ? t('calDay',{d:fd(S.calDay)}) : t('calList',{m:MON[mo]+' '+y});
  $('calClear').style.display = S.calDay?'':'none';
  var cols=[['label','c_tag'],['desc','c_desc'],['deck','c_deck'],['eta','c_eta'],['ros','c_ros'],['float','c_float'],['status','c_status']];
  $('calList').innerHTML = itemTable(rows, cols, true);
  bindRows($('calList'));
  renderChanges();
}
function renderChanges(){
  var ch=D.changes||[], h='<h4><span>'+t('chgTitle')+'</span><small>'+ch.filter(function(c){return c.kind==='changed';}).length+'</small></h4>';
  if(D.changesSince) h+='<div class="count" style="margin-bottom:8px">'+t('chgSince',{t:fdt(D.changesSince), f:esc(D.changesBase||'')})+'</div>';
  if(!ch.length){ h+='<div class="empty">'+(D.changesSince?t('chgNone'):t('chgFirst'))+'</div>'; $('chgCard').innerHTML=h; return; }
  h+='<div class="tbl-wrap" style="max-height:720px"><table><thead><tr><th class="ns">'+t('c_tag')+'</th><th class="ns">'+t('old')+'</th><th class="ns">'+t('nw')+'</th><th class="ns">'+t('delta')+'</th></tr></thead><tbody>';
  ch.forEach(function(c){
    var cls='', dl='';
    if(c.kind==='changed' && c.delta==null){ dl='<span class="badge" style="background:var(--dw-IFR)">'+t('etaBlank')+'</span>'; }
    else if(c.kind==='changed'){ cls=c.delta>0?'r-up':'r-dn'; dl='<span class="'+(c.delta>0?'chg-up':'chg-dn')+'">'+(c.delta>0?'+':'')+c.delta+' '+t('days')+'</span><br><small style="color:var(--ink3)">'+(c.delta>0?t('pushed'):t('pulled'))+'</small>'; }
    else dl='<span class="badge b-muted">'+t(c.kind)+'</span>';
    h+='<tr class="'+cls+'" data-id="'+esc(c.id)+'"><td class="tag">'+esc(c.label)+'<br><small style="color:var(--ink3);font-weight:400">'+esc(c.desc)+'</small></td><td class="nw num">'+fd(c.old)+'</td><td class="nw num"><b>'+fd(c.new)+'</b></td><td class="nw">'+dl+'</td></tr>';
  });
  h+='</tbody></table></div>';
  $('chgCard').innerHTML=h;
  $('chgCard').querySelectorAll('tr[data-id]').forEach(function(tr){ tr.onclick=function(){
    var it=byId(tr.dataset.id); if(!it) return;
    if(it.eta){ var d=pd(it.eta); S.calMonth=new Date(d.getFullYear(),d.getMonth(),1); S.calDay=it.eta; }
    S.sel=it.id; renderCal(); setTimeout(scrollSel,30); }; });
}

/* =================== TAB 4 – LIFTING GEAR =================== */
function renderLift(){
  var cols=['c_no','l_id','c_desc','l_type','l_swl','l_qty','l_cert','l_exp','l_for','l_crane','l_status','c_note'];
  var h='<table><thead><tr>'+cols.map(function(c){return '<th class="ns">'+t(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  for(var i=0;i<6;i++) h+='<tr style="cursor:default">'+cols.map(function(c,j){ return '<td style="color:#c3cbd4">'+(i===0&&j===2?t('liftEmpty'):'&nbsp;')+'</td>'; }).join('')+'</tr>';
  $('liftTbl').innerHTML=h+'</tbody></table>';
}

/* =================== CẢNH BÁO (drawer) =================== */
function openDrawer(){
  var h='';
  h+='<h5>'+t('checks')+'</h5>'+D.checks.map(function(c){ return '<div class="wi '+(c.ok?'ok':'bad')+'">'+(c.ok?'✓ ':'⚠ ')+esc(S.lang==='en'?c.en:c.vi)+': <b>'+c.a+' / '+c.b+'</b> <span style="color:var(--ink3)">('+esc(c.detail)+')</span></div>'; }).join('');
  var cr=D.cross, labs={missing:['Tag thiếu trên slide','Missing on slides'],extra:['Tag thừa trên slide','Extra on slides'],wrongDeck:['Tag sai sàn','Wrong deck'],etaDiff:['ETA slide ≠ MEL','Slide ETA ≠ MEL'],noBubble:['Không có bubble','No bubble']};
  h+='<h5>'+t('crossT')+'</h5>'+Object.keys(labs).map(function(k){ var n=cr[k].length; return '<div class="wi '+(n?(k==='noBubble'?'info':'warn'):'ok')+'">'+(n?'':'✓ ')+labs[k][S.lang==='en'?1:0]+': <b>'+n+'</b>'+(n?' – '+cr[k].map(function(x){return esc(x.tag)+(x.slide?' (slide '+x.slide+')':'');}).join(', '):'')+'</div>'; }).join('');
  var md=mainItems().filter(function(i){return i.deck==='MD';});
  [6,7].forEach(function(n){ var l=md.filter(function(i){return i.slide===n;}); if(l.length) h+='<div class="wi info">MD → slide '+n+': '+l.map(function(i){return esc(i.label);}).join(', ')+'</div>'; });
  var ws=D.warnings.filter(function(w){return w.level==='warn';}), inf=D.warnings.filter(function(w){return w.level!=='warn';});
  h+='<h5>'+t('dataIssues')+' ('+ws.length+')</h5>'+(ws.length?ws.map(function(w){return '<div class="wi warn">'+esc(wtxt(w))+'</div>';}).join(''):'<div class="wi ok">✓</div>');
  if(inf.length) h+='<h5>'+t('infoT')+'</h5>'+inf.map(function(w){return '<div class="wi info">'+esc(wtxt(w))+'</div>';}).join('');
  if(IS_SERVER) h+='<p><a href="check_report.txt" target="_blank">'+t('openReport')+'</a></p>';
  $('drTitle').textContent=t('warnTitle'); $('drBody').innerHTML=h;
  $('drawer').classList.add('on'); $('backdrop').classList.add('on');
}
function closeDrawer(){ $('drawer').classList.remove('on'); $('backdrop').classList.remove('on'); }

/* =================== CẬP NHẬT (server) =================== */
var toastTimer=null;
function toast(msg, sub, err, onclick, ms){
  var el=$('toast'); el.innerHTML=esc(msg)+(sub?'<small>'+esc(sub)+'</small>':''); el.classList.toggle('err',!!err); el.classList.add('on');
  el.onclick=function(){ el.classList.remove('on'); onclick&&onclick(); };
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove('on'); }, ms||(err?12000:8000));
}
function setBusy(b){ var btn=$('btnUpd'); btn.disabled=b; btn.classList.toggle('busy',b); $('btnUpdTxt').textContent=b?t('updating'):t('update'); }
function doUpdate(){
  if($('btnUpd').disabled) return;
  setBusy(true);
  fetch('/api/update',{method:'POST'}).then(function(r){ return r.json().then(function(j){ return {code:r.status, j:j}; }); })
  .then(function(res){
    var j=res.j;
    if(res.code===409 || j.busy){ toast(t('toastBusy'), '', true); pollStatus(); return; }
    if(!j.ok){ setBusy(false); toast(t('toastErr'), S.lang==='en'?(j.error_en||j.error_vi):j.error_vi, true); pollStatus(); return; }
    reload(function(){ setBusy(false); toast(t('toastOk',{c:j.eta_changes, w:j.warnings}), t('toastClick'), false, function(){ if(j.eta_changes) setTab('cal'); openDrawer(); }); pollStatus(); });
  }).catch(function(){ setBusy(false); toast(t('serverDown'), '', true); });
}
function reload(cb){
  loadData(function(ok){ if(ok && D){ renderAll(); } cb&&cb(ok); });
}
function pollStatus(){
  if(!IS_SERVER) return;
  fetch('/api/status',{cache:'no-store'}).then(function(r){return r.json();}).then(function(s){
    lastStatus=s;
    if(s.updating && !$('btnUpd').disabled) setBusy(true);
    if(!s.updating && $('btnUpd').classList.contains('busy') && !pending) setBusy(false);
    if(D && s.data_version && s.data_version!==D.meta.generated && !s.updating){
      reload(function(){ toast(t('toastAuto'), t('toastClick'), false, function(){ if(D.changes.length) setTab('cal'); openDrawer(); }); });
    } else if(D) updLine();
  }).catch(function(){ lastStatus=null; if(D) updLine(); });
}
var pending=false;

/* =================== RENDER =================== */
function renderAll(){
  renderHeader(); renderOverview(); renderLift();
  if(S.tab==='lay') renderLayout();
  if(S.tab==='cal') renderCal();
  if(S.sel){ var it=byId(S.sel); if(it && $('pop').classList.contains('on')) showPop(it); else if(!it) { S.sel=null; closePop(); } }
}
function boot(){
  document.querySelectorAll('#tabs button').forEach(function(b){ b.onclick=function(){ setTab(b.dataset.tab); }; });
  document.querySelectorAll('.lang button').forEach(function(b){ b.onclick=function(){ S.lang=b.dataset.lang; saveUi(); renderAll(); }; });
  $('pillChg').onclick=function(){ setTab('cal'); };
  $('pillWarn').onclick=openDrawer; $('drClose').onclick=closeDrawer; $('backdrop').onclick=closeDrawer;
  $('btnUpd').onclick=doUpdate;
  $('btnFs').onclick=function(){ var w=$('stageWrap'); if(document.fullscreenElement) document.exitFullscreen(); else if(w.requestFullscreen) w.requestFullscreen(); };
  $('laySearch').addEventListener('change', function(){ layFind(this.value); });
  $('laySearch').addEventListener('keydown', function(e){ if(e.key==='Enter') layFind(this.value); });
  $('calPrev').onclick=function(){ S.calMonth=new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()-1, 1); S.calDay=null; renderCal(); };
  $('calNext').onclick=function(){ S.calMonth=new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+1, 1); S.calDay=null; renderCal(); };
  $('calToday').onclick=function(){ var n=new Date(); S.calMonth=new Date(n.getFullYear(), n.getMonth(), 1); S.calDay=null; renderCal(); };
  $('calSel').onchange=function(){ var p=this.value.split('-'); S.calMonth=new Date(+p[0], +p[1]-1, 1); S.calDay=null; renderCal(); };
  $('calClear').onclick=function(e){ e.preventDefault(); S.calDay=null; renderCal(); };
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closePop(); closeDrawer(); } });
  loadData(function(ok){
    if(!ok || !D){ document.querySelector('main').innerHTML='<div class="fatal"><h2>STT2B Dashboard</h2><p>'+esc(t('fatal'))+'</p></div>'; renderHeaderMinimal(); return; }
    renderAll(); setTab(S.tab||'ov');
    if(IS_SERVER){ pollStatus(); setInterval(pollStatus, 60000); }
  });
}
function renderHeaderMinimal(){ if(!IS_SERVER){ $('updBox').style.display='none'; $('viewOnly').style.display=''; } }
window.STT2B_UI={select:function(id){selectTag(id,{jump:true});}, find:layFind, state:S};
boot();
})();
</script>
